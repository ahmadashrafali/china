",label:"Stone Forest",note:"if timings allow",glyph:"stones"},{kind:"hotel",zh:"宿",label:"Waldorf Astoria",note:"on the Bund",glyph:"skyline"},{act:"d20a1",zh:"裁",label:"Fabric Market",note:"ORDER tailoring",glyph:"scissors"},{act:"d20a2",zh:"里",label:"French Concession",note:"the slow walk",glyph:"tree"},{act:"d20a3",zh:"坊",label:"Tianzifang",note:"art & gifts",glyph:"lane"},{act:"d21a1",zh:"乐",label:"Disneyland",note:"Fri · Mid-Autumn",glyph:"castle"},{act:"d22a2",zh:"塔",label:"Shanghai Tower",note:"the deck",glyph:"tower"},{act:"d22a3",zh:"衣",label:"Collect tailoring",note:"48-hr turnaround",glyph:"scissors"},{act:"d22a5",zh:"蟹",label:"Hairy crab",note:"farewell dinner",glyph:"market"}],days:[{id:"d19",n:19,date:"Sept 23",title:"Lugu → Kunming → Shanghai",staying:"Waldorf Astoria on the Bund",acts:[{id:"d19a1",t:"Fly NLH → Kunming; Stone Forest stop if the timings allow"},{id:"d19a2",t:"Fly Kunming → Shanghai"},{id:"d19a3",t:"Late check-in at the Waldorf; first look at the Bund"}],transport:"Two flights and a long day. Confirm the NLH airport transfer with Jadeer when you book.",tip:"Stone Forest only works if the Kunming layover is 5+ hrs — it's ~1.5 hrs each way. Check the flight times before committing; there's no shame in a lounge instead."},{id:"d20",n:20,date:"Sept 24",title:"Tailoring & Old Shanghai",staying:"Overnight in Shanghai",acts:[{id:"d20a1",t:"MORNING: South Bund Fabric Market — ORDER the tailoring"},{id:"d20a2",t:"French Concession wander — Anfu, Wukang, Fuxing Park"},{id:"d20a3",t:"Tianzifang alleyways"}],transport:"Fabric Market: DiDi ~15 min. French Concession: ~10 min.",tip:"Order in the morning, not the afternoon — the 48-hour turnaround has to land before Sept 26. Bring reference photos on your phone.",alt:"Yongkang Rd (coffee), Julu Rd (boutiques), Xinle Rd (design) — one block off the main strips and the crowds vanish.",shopping:"Qipao + any extra pieces. Negotiate fabric and make as one price."},{id:"d21",n:21,date:"Sept 25",title:"Shan rmations + flight ref 9NXG6J",src:"v10"},{id:"p-pkx",t:"⚠ Arrival is DAXING (PKX), not PEK — allow ~1 hr to Xuanwumen. Departure Sep 26: leave the hotel ~21:00 for the 00:35 flight",src:"v10"},{id:"p-vpn",t:"Install ExpressVPN / NordVPN before entering China — you cannot install one once inside",src:"v7"},{id:"p-wechat",t:"WeChat — download and link an international card. China runs on it",src:"v7"},{id:"p-alipay",t:"Alipay — set up as the backup payment",src:"v7"},{id:"p-didi",t:"DiDi — install and set up before arrival",src:"v7"},{id:"p-trans",t:"Google Translate — download the Chinese offline pack; camera mode is essential",src:"v7"},{id:"p-trip",t:"Trip.com account — domestic flights, trains, and several of the hotels",src:"v7"},{id:"p-diamox",t:"Diamox prescription from your doctor in Cairo — the ladder is Lijiang 2,400m → gorge → Shangri-La 3,200m",src:"v10"},{id:"p-oxy",t:"Buy oxygen cans in Lijiang (~15 RMB) before the gorge; Songzanlinli rooms have their own oxygen supply",src:"v10"},{id:"p-cash",t:"Carry ~500 RMB (~$70) emergency cash",src:"v7"},{id:"p-esim",t:"Install & test the China eSIM before departure — confirm data works with the VPN on",src:"new"},{id:"p-maps",t:"Download offline maps (Amap or Organic Maps) — Google Maps is blocked and unreliable there",src:"new"},{id:"p-bank",t:"Notify banks + verify your card actually completes a WeChat Pay top-up (foreign-card verification wants passport photos — do it at home)",src:"new"},{id:"p-ins",t:"Travel insurance covering trekking + altitude (Tiger Leaping Gorge high trail, 3,200m Shangri-La)",src:"new"},{id:"p-pass",t:"Passports valid 6+ months. Physical passports needed at Universal AND Disneyland — tickets are passport-linked",src:"v10"},{id:"p-adapter",t:"⚠ Adapter check: mainland China uses Type A / C / I — NOT Type G (that's UK/HK). The v10 doc says Type-G; buy A/C/I",src:"new"},{id:"p-gear",t:"Pack: Terrex boots (wall + gorge), puffer for Impression Lijiang + Shangri-La, day-pack for the trek night",src:"v10"},{id:"p-rain",t:"September is the tail of Yunnan's rainy season — Sep 17 is the built-in backup for Yak Meadow / Impression; gorge high trail can close after heavy rain (fallback: Middle Gorge rapids loop from Tina's)",src:"v10"},{id:"p-maf",t:"Sept 25 is Mid-Autumn Festival AND your Disneyland day AND a Friday. Buy Premier Access; rope-drop; buy mooncakes",src:"new"},{id:"p-share",t:"Share the full itinerary + hotel list with family before flying",src:"new"}],qy=Ph.reduce((t,e)=>t+e.est,0),nu=zl.flatMap(t=>t.days.flatMap(e=>e.acts.map(l=>l.id))),ba=[{id:"p0",name:"Order to Riyadh",zh:"预",stop:null,lo:2650,hi:3650,sub:"Arrives at home before you fly. ★ items make the honeymoon itself better — order by early August, 3–4 weeks before the wedding.",items:[{id:"sp-osmo",star:!0,t:"DJI Osmo Pocket 3 — Creator Combo",where:"Jarir / Amazon.sa / DJI store",lo:650,hi:700,note:"THE honeymoon camera. Creator Combo adds mic + battery handle. Have it for the wedding in Cairo AND the Wall on Sep 7. DJI prices are near-identical worldwide; no reason to wait for China."},{id:"sp-rokid",star:!0,t:"Rokid AI Glasses — GLOBAL display version",where:"global.rokid.com / Amazon",lo:450,hi:600,note:"Live translation captions in your line of sight — the killer feature for menus & signs. Do NOT buy inside China: domestic firmware means Chinese-only AI + app store."},{id:"sp-emo",t:"EMO robot (Living.AI) or LOOI",where:"living.ai / looirobot.com / Amazon",lo:300,hi:380,note:"Desktop AI companion — the conversation piece. EMO: deeper personality, no subscription. LOOI (~$160): phone-docking + wireless charger."},{id:"sp-wow",t:"WowCube",where:"wowcube.com / Amazon",lo:250,hi:300,note:"American (Cubios) — an online order, not a China find."},{id:"sp-hand",t:"Gaming handheld — AYANEO 3 or GPD Win 5",where:"ayaneo.com / GPD store / Amazon",lo:900,hi:1800,note:"Full Windows 11, works anywhere. No urgency — can also come after the trip. Avoid AYANEO Next 2: its 116Wh battery exceeds airline limits."}]},{id:"s-bj",name:"Beijing",zh:"京",stop:"bj",dates:"Sept 6–10",lo:200,hi:500,sub:"⚠ Panjiayuan was cut in v10. Liulichang is the replacement — antiques, ink stones, seals and brushes, and it's a 10-minute walk from the JW Marriott at Xuanwumen.",items:[{id:"sp-llc",t:"Ink stones, seals, brushes, scrolls, old books",where:"Liulichang Culture Street — walkable from the hotel",lo:60,hi:200,note:"ADDED for v10, replacing Panjiayuan. Quieter and closer; prices are fixed-ish but still worth a polite negotiation. Best 'wow' gifts for the Riyadh home."},{id:"sp-wud",t:"Contemporary Chinese design, ceramics, handmade jewelry",where:"Wudaoying boutiques · Sep 8",lo:50,hi:150,note:"Quality independent boutiques, fair fixed prices — already on the itinerary."},{id:"sp-xm",t:"Xiaomi Night Light 3, smart-home bits, GaN chargers",where:"Xiaomi flagship · Joy City / Sanlitun",lo:30,hi:80,note:"Fun in-China electronics stop #1. Chargers and lights are universal voltage — zero risk abroad."},{id:"sp-tcm",t:"TCM gift sets — goji, chrysanthemum, red dates",where:"Tongrentang pharmacy (350-year-old brand)",lo:30,hi:60,note:"Beautifully boxed = easy family gifts. All customs-safe."},{id:"sp-uni",t:"Universal Studios merch for the family kids",where:"Universal Beijing · Sep 9",lo:30,hi:80,note:"ADDED for v10 — you're there all day anyway, and it's the one thing the nieces and nephews will recognise instantly."}]},{id:"s-cq",name:"Chongqing",zh:"渝",stop:"cq",dates:"Sept 10–13",lo:60,hi:140,sub:"General areas: Jiefangbei pedestrian zone, Guanyinqiao for the local vibe.",items:[{id:"sp-tgy",t:"Spice pastes, hand-woven bamboo, Chongqing coffee",where:"Tongguanyi Ancient Town · Sep 11",lo:30,hi:80,note:"Authentic, low prices, no tourist markup — already on the itinerary."},{id:"sp-hot",t:"Hotpot base packs, mala seasoning, huajiao × 8–10",where:"Yonghui / Hema supermarket near Jiefangbei",lo:30,hi:60,note:"Supermarket = the same brands locals buy at half tourist-shop price. Sealed packs are customs-safe. Checked luggage, double zip-locked."}]},{id:"s-cd",name:"Chengdu",zh:"蓉",stop:"cd",dates:"Sept 13–15",lo:160,hi:400,sub:"Only 2 nights now — Kuanzhai on Sep 13, the supermarket run on Sep 14. Moondrop's HQ city if you want the detour.",items:[{id:"sp-shu",t:"Shu embroidery, lacquerware, Zhuyeqing tea, bamboo trays",where:"Kuanzhai Alley · Sep 13",lo:80,hi:200,note:"Shu embroidery is one of China's four great styles — a small framed piece is a genuinely special gift."},{id:"sp-pep",t:"Green + red huajiao, Pixian doubanjiang, dried chilies",where:"Local supermarket · Sep 14 — NOT the tourist street",lo:20,hi:50,note:"Worlds better than export grade. Checked luggage, double-sealed."},{id:"sp-moon",t:"Moondrop IEMs — Aria 2 or up",where:"Moondrop flagship store (their HQ city)",lo:70,hi:150,note:"Fun electronics stop #2 — an audiophile pilgrimage. Standard 3.5mm/USB-C, works everywhere. Tight on a 2-night stay; skip without guilt."},{id:"sp-pnd",t:"Panda plushies & base merch",where:"Wolong panda base gift shop · Sep 14",lo:30,hi:60,note:"The base shop is the best panda-gift source on the route."}]},{id:"s-lj",name:"Lijiang",zh:"丽",star:!0,stop:"lj",dates:"Sept 15–18",lo:250,hi:600,sub:"★ Best craft shopping of the whole trip. Sep 17 is the dedicated sweep day.",items:[{id:"sp-slv",t:"S999 silver for Nada (bracelet/pendant) + gift pieces",where:"Workshops in the Old Town alleys around Sifang",lo:100,hi:300,note:"Buy where the smith is working at the bench. The '999' stamp = fine silver. Hand luggage home."},{id:"sp-puer",t:"Pu'er tea cakes — raw (sheng) + ripe (shou), 3–5 cakes",where:"Old Town tea houses — taste before buying",lo:60,hi:200,note:"You're near the source. Sheng ages beautifully — one cake per family household is a prestige gift that packs flat."},{id:"sp-ind",t:"Indigo tie-dye, Dongba paper crafts, Bunong bells",where:"Sifang alleys + Shuhe Ancient Town (Sep 15)",lo:40,hi:100,note:"Bunong bells are made ONLY in Lijiang. Shuhe often beats the main Old Town on price — and you're there on arrival day."},{id:"sp-cof",t:"Yunnan coffee beans + rose flower cakes × 8–10 boxes",where:"Old Town roasters & bakeries",lo:50,hi:100,note:"Flower cakes are THE Yunnan edible gift. Buy vacuum-sealed boxes on Sep 17 so they're fresh."}]},{id:"s-sl",name:"Shangri-La",zh:"香",stop:"sl",dates:"Sept 19–21",lo:120,hi:350,sub:"Skip yak jerky and all yak-meat products — meat is a hard NO through Saudi customs.",items:[{id:"sp-yak",t:"Hand-woven yak wool scarves × 3–5 as gifts",where:"Dukezong handicraft market · Sep 19–20",lo:50,hi:150,note:"A completely different craft tradition from Lijiang — worth buying both."},{id:"sp-tib",t:"Tibetan silver, prayer beads, small thangka painting",where:"Dukezong market + monastery-adjacent shops",lo:70,hi:200,note:"Real hand-painted thangkas run $100+; printed ones are $10–20 — ask directly which you're being shown."}]},{id:"s-lg",name:"Lugu Lake",zh:"泸",stop:"lg",dates:"Sept 21–23",lo:20,hi:50,sub:"Minimal by design — this is the rest-and-romance leg.",items:[{id:"sp-mos",t:"Mosuo hand-woven textiles, small local crafts",where:"Daluoshui village stalls / hotel boutique",lo:20,hi:50,note:"Anything bought here is a pure keepsake."}]},{id:"s-sh",name:"Shanghai",zh:"沪",star:!0,stop:"sh",dates:"Sept 23–26",lo:350,hi:1e3,sub:"★ Grand finale + all catch-up buys. Tailoring: ORDER Sep 24 morning, COLLECT Sep 26.",items:[{id:"sp-qip",t:"Custom qipao for Nada (+ optional coat/dress)",where:"South Bund Fabric Market — order Sep 24, collect Sep 26",lo:100,hi:250,note:"Bring reference photos. Negotiate fabric + make as one price. Order in the MORNING — the 48-hr window is tight."},{id:"sp-des",t:"Chinese designer piece for her — fashion or jewelry",where:"TX Huaihai · K11 Art Mall · IAPM",lo:100,hi:500,note:"The 'one special thing from Shanghai' budget — flexible by design."},{id:"sp-tzf",t:"Art prints, artisan gifts, local design objects",where:"Tianzifang · Sep 24",lo:50,hi:150,note:"Now

5\u56ED Meiyuan dairy shops \u2014 one near Niujie"},{t:"Tanghulu candied hawthorn",s:"in the hutongs, straight off the stick"},{t:"Imperial milk custard",s:"Nailao Wei \u5976\u916A\u9B4F \xB7 Wenyu Nailao in Nanluoguxiang"}]},{zh:"\u6B65",name:"Strolls",items:[{t:"Liulichang scroll-and-seal street",s:"10 min walk \u2014 your arrival-evening plan"},{t:"Yandai Xiejie + Silver Ingot Bridge",s:"the Houhai hutong classic"},{t:"Temple of Heaven cypress park at 7am",s:"arrive when the tai-chi crews do \u2014 your Sep 10 plan"}]},{zh:"\u73A9",name:"Fun & only-in-China",items:[{t:"Hanfu couple photoshoot",s:"Ming/Qing imperial dress + photographer around Jingshan, ~300\u2013600 RMB via Trip.com \u2014 the honeymoon-album banger. Slot: Sep 8 PM"},{t:"Joy City Xidan arcade floor",s:"claw machines + rhythm games, 10 min \u2014 China's arcade culture is its own spectacle"}]}],days:[{id:"d1",n:1,date:"Sept 5",title:"Wedding Recovery & Wheels Up",staying:"Overnight flight via Doha",acts:[{id:"d1a1",t:"Slow recovery morning in Cairo \u2014 the wedding was yesterday"},{id:"d1a2",t:"CAI 19:55 \u2192 Doha 23:10 \xB7 3h transit \xB7 overnight to Beijing"}],transport:"Qatar Airways ref 9NXG6J. Check-in opens 48 hrs before each leg \u2014 set for Sep 3, ~20:00.",tip:"Sleep on the Doha\u2013Beijing leg (02:10 \u2192 15:00). The first evening is deliberately light."},{id:"d2",n:2,date:"Sept 6",title:"Land \xB7 Liulichang Lanterns",staying:"JW Marriott Beijing Central",acts:[{id:"d2a1",t:"Land PKX Daxing 15:00 \u2014 car ~1 hr to Xuanwumen"},{id:"d2a2",t:"Liulichang stroll \u2014 scroll shops, seal carvers, ink stones (10-min walk)"},{id:"d2a3",t:"\u{1F534} Buy a 3C-certified power bank en route (Xiaomi store \u2014 flight rule)"},{id:"d2a4",t:"Qianmen / Dashilan lanterns"},{id:"d2a5",t:"Beef zhajiangmian dinner \u2014 \u725B\u8089\u70B8\u9171\u9762"}],transport:"\u26A0 Arrival is DAXING (PKX), south side \u2014 conveniently your side of town. Exchange some cash at the airport.",tip:"Light by design. Everything tonight is walkable from the hotel."},{id:"d3",n:3,date:"Sept 7",title:"The Wild Great Wall",staying:"Overnight in Beijing",acts:[{id:"d3a1",t:"Jiankou wild wall \u2014 private driver + picnic, crumbling towers, almost no one"},{id:"d3a2",t:"Traverse east to Mutianyu; descend by toboggan"},{id:"d3a3",t:"Early quiet night \u2014 or King's Joy if booked for tonight"}],transport:"Driver 6:30am \u2192 Xizhazi Village (~2 hrs); waits at Mutianyu. Never attempt Jiankou without a driver.",tip:"Monday is right for this \u2014 the Forbidden City is shut Mondays. Terrex boots, 2L water, SPF50."},{id:"d4",n:4,date:"Sept 8",title:"Imperial Beijing & the Hanfu Shoot",staying:"Overnight in Beijing",acts:[{id:"d4a1",t:"Forbidden City at 8:30 opening \u2014 booked at the 7-day release (Sep 1!)"},{id:"d4a2",t:"Jingshan Park \u2014 the full palace panorama"},{id:"d4a3",t:"Wudaoying Hutong \u2014 boutiques, coffee"},{id:"d4a4",t:"Hanfu couple photoshoot \u2014 imperial dress around Jingshan/hutongs"},{id:"d4a5",t:"Peking duck at Da Dong (booked)"}],transport:"Palace: DiDi ~15 min; enter via the quieter West Gate. Jingshan: 5-min walk from the north gate.",tip:"Tickets are passport-linked and released 7 days ahead at 20:00 Beijing time \u2014 for Sep 8 that's Sep 1, 15:00 Riyadh time. They sell out."},{id:"d5",n:5,date:"Sept 9",title:"Universal Studios Beijing",staying:"Overnight in Beijing",acts:[{id:"d5a1",t:"\u{1F3A2} Universal \u2014 rope-drop the gate, Express for the big four"},{id:"d5a2",t:"Evening: collapse gloriously"}],transport:"Tongzhou, 45\u201360 min DiDi. Leave by 7:30. Physical passports \u2014 tickets are passport-linked.",tip:"Wednesday = light queues. That's why it's today."}]},{id:"cq",name:"Chongqing",zh:"\u91CD\u5E86",dates:"Sept 10\u201313",nights:3,hotel:"YOLO Reef Private Onsen",hotelDesc:"The private-onsen recovery stop. Your hotel IS one of the dates.",scroll:[{kind:"hotel",zh:"\u5BBF",label:"YOLO Reef",note:"private onsen",glyph:"pool"
